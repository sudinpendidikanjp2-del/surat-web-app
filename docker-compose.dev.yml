# Database lokal untuk pengembangan dan uji. Aplikasi dijalankan langsung dengan npm.
#   docker compose -f docker-compose.dev.yml up -d
# Menyiapkan database `surat` (dev) dan `surat_test` (uji) dengan akun surat/surat_dev.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surat
      POSTGRES_PASSWORD: surat_dev
      POSTGRES_DB: surat
    ports:
      - "5432:5432"
    volumes:
      - pgdev:/var/lib/postgresql/data
      - ./deploy/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surat -d surat"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdev:
