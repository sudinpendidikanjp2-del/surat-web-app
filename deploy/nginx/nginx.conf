# nginx.conf utama. Konfigurasi situs ada di site.conf.template (dirender envsubst oleh image resmi nginx).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  # Lampiran maksimal MAX_UPLOAD_MB (bawaan 15 MB) per berkas; beri ruang untuk multipart. Unggah cadangan diatur sendiri.
  client_max_body_size 40m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Log tanpa query string: kode lacak, kata kunci pencarian, dan kode OAuth tidak tercatat.
  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # Batas laju di tepi (lapis pertama; aplikasi punya lapis kedua per akun dan per alamat).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=lacak:10m rate=1r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  include /etc/nginx/conf.d/*.conf;
}
