proxy_pass http://app_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# WAJIB menimpa (bukan menambah) agar klien tidak dapat memalsukan IP; aplikasi membacanya bila TRUST_PROXY=true.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Nginx yang memasang HSTS/nosniff (add_header ... always) sehingga juga ada pada galat buatan Nginx; hindari ganda.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
